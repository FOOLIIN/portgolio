services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.3"]

  server:
    build: ./server
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - SECRET_KEY=change-me-to-a-long-random-string
    depends_on:
      - mongodb

  frontend:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongo-data:

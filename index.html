<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="fool 的个人站点,用于学习和展示" />
  <title>fool的第一个互联网地盘</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="site-nav">
    <div class="nav-inner">
      <!-- Logo -->
      <a href="#" class="logo" aria-label="首页">fool</a>

      <!-- 主菜单 -->
      <nav class="nav-menu" aria-label="主导航">
        <ul>
          <li><a href="#">首页</a></li>
          <li><a href="https://github.com/FOOLIIN/portgolio" target="_blank" rel="noopener">GitHub</a></li>
        </ul>
      </nav>

      <!-- 工具按钮 -->
      <div class="nav-tools">
        <button type="button" class="icon-btn" aria-label="搜索">🔍</button>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="切换主题" aria-pressed="false">🌙</button>
        <button type="button" class="nav-toggle" id="nav-toggle" aria-label="菜单" aria-expanded="false">☰</button>
      </div>
    </div>

    <!-- 移动端抽屉菜单 -->
    <nav class="nav-drawer" id="nav-drawer" aria-label="移动端导航" hidden>
      <ul>
        <li><a href="#">首页</a></li>
        <li><a href="https://github.com/FOOLIIN/portgolio" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
    </nav>
  </header>

  <!-- 页面主体 -->
  <main>
    <p>我是一名普通的大学生</p>
    <p>这个站点是我用来学习和展示的</p>
    <section id="projects">
      <h2>我的项目</h2>
      <div id="repo-list">加载中.....</div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-cols">
        <nav class="footer-col" aria-label="页脚导航">
          <h2 class="footer-title">导航</h2>
          <ul>
            <li><a href="#">首页</a></li>
            <li><a href="https://github.com/FOOLIIN/portgolio" target="_blank" rel="noopener">GitHub</a></li>
          </ul>
        </nav>

        <nav class="footer-col" aria-label="联系方式">
          <h2 class="footer-title">联系</h2>
          <ul>
            <li><a href="https://github.com/FOOLIIN" target="_blank" rel="noopener">GitHub 主页</a></li>
          </ul>
        </nav>
      </div>

      <!-- 底部条 -->
      <div class="footer-bottom">
        <p class="footer-copy">© <span id="year">2026</span> fool. All rights reserved.</p>
        <a href="#page" class="back-to-top" aria-label="回到顶部">Scroll to Top ↑</a>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var KEY = 'site-theme';
      var MODES = ['dark', 'light', 'system'];
      var ICONS = { dark: '🌙', light: '☀️', system: '🖥️' };
      var LABELS = {
        dark: '当前:深色,点击切换',
        light: '当前:浅色,点击切换',
        system: '当前:跟随系统,点击切换'
      };
      function getStored() {
        try { return localStorage.getItem(KEY); } catch (e) { return null; }
      }
      function setStored(v) {
        try { localStorage.setItem(KEY, v); } catch (e) {}
      }
      var mode = getStored();
      if (MODES.indexOf(mode) === -1) mode = 'system'; // 默认跟随系统

      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      function systemDark() { return mq.matches; }

      var btn = document.getElementById('theme-toggle');
      function apply() {
        var dark = mode === 'dark' || (mode === 'system' && systemDark());
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (btn) {
          btn.textContent = ICONS[mode];
          btn.setAttribute('aria-label', LABELS[mode]);
          btn.setAttribute('aria-pressed', String(dark));
        }
      }
      if (btn) {
        btn.addEventListener('click', function () {
          var i = MODES.indexOf(mode);
          mode = MODES[(i + 1) % MODES.length];
          setStored(mode);
          apply();
        });
      }
      // 系统主题变化时实时跟随
      if (mq.addEventListener) {
        mq.addEventListener('change', apply);
      } else if (mq.addListener) {
        mq.addListener(apply);
      }
      apply();

      // 移动端抽屉菜单
      var toggle = document.getElementById('nav-toggle');
      var drawer = document.getElementById('nav-drawer');
      if (toggle && drawer) {
        toggle.addEventListener('click', function () {
          var open = drawer.hasAttribute('hidden');
          if (open) {
            drawer.removeAttribute('hidden');
            toggle.setAttribute('aria-expanded', 'true');
            toggle.textContent = '✕';
          } else {
            drawer.setAttribute('hidden', '');
            toggle.setAttribute('aria-expanded', 'false');
            toggle.textContent = '☰';
          }
        });
        // 点击链接后自动收起
        drawer.addEventListener('click', function (e) {
          if (e.target.tagName === 'A') {
            drawer.setAttribute('hidden', '');
            toggle.setAttribute('aria-expanded', 'false');
            toggle.textContent = '☰';
          }
        });
      }
      fetch('https://api.github.com/users/FOOLIIN/repos')
        .then(function (response) {
          if(!response.ok) {
            throw new Error('Network response was not ok');
          }
          return response.json();
        })
        .then(function (repos) {
          var box = document.getElementById('repo-list');
          box.innerHTML = '';
          repos.forEach(function (repo) {
            var card = document.createElement('div');
            card.className = 'repo-card';
            card.innerHTML = `
              <h3 class="repo-title">${repo.name}</h3>
              <p class="repo-desc">${repo.description}</p>
              <a href="${repo.html_url}" class="repo-link" target="_blank" rel="noopener">View on GitHub</a>
            `;
            box.appendChild(card);
          });
        })
        .catch(function (error) {
          console.error(' GITHUB API Error:', error);
        });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="fool 的个人站点,用于学习和展示" />
  <title>fool的第一个互联网地盘</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="site-nav">
    <div class="nav-inner">
      <!-- Logo -->
      <a href="#" class="logo" aria-label="首页">fool</a>

      <!-- 主菜单 -->
      <nav class="nav-menu" aria-label="主导航">
        <ul>
          <li><a href="#">首页</a></li>
          <li><a href="https://github.com/FOOLIIN/portgolio" target="_blank" rel="noopener">GitHub</a></li>
        </ul>
      </nav>

      <!-- 工具按钮 -->
      <div class="nav-tools">
        <button type="button" class="icon-btn" aria-label="搜索">🔍</button>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="切换主题" aria-pressed="false">🌙</button>
        <button type="button" class="nav-toggle" id="nav-toggle" aria-label="菜单" aria-expanded="false">☰</button>
      </div>
    </div>

    <!-- 移动端抽屉菜单 -->
    <nav class="nav-drawer" id="nav-drawer" aria-label="移动端导航" hidden>
      <ul>
        <li><a href="#">首页</a></li>
        <li><a href="https://github.com/FOOLIIN/portgolio" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
    </nav>
  </header>

  <!-- 页面主体 -->
  <main>
    <p>我是一名普通的大学生</p>
    <p>这个站点是我用来学习和展示的</p>
    
  </main>

  <!-- 页脚 -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-cols">
        <nav class="footer-col" aria-label="页脚导航">
          <h2 class="footer-title">导航</h2>
          <ul>
            <li><a href="#">首页</a></li>
            <li><a href="https://github.com/FOOLIIN/portgolio" target="_blank" rel="noopener">GitHub</a></li>
          </ul>
        </nav>

        <nav class="footer-col" aria-label="联系方式">
          <h2 class="footer-title">联系</h2>
          <ul>
            <li><a href="https://github.com/FOOLIIN" target="_blank" rel="noopener">GitHub 主页</a></li>
          </ul>
        </nav>
      </div>

      <!-- 底部条 -->
      <div class="footer-bottom">
        <p class="footer-copy">© <span id="year">2026</span> fool. All rights reserved.</p>
        <a href="#page" class="back-to-top" aria-label="回到顶部">Scroll to Top ↑</a>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var KEY = 'site-theme';
      var stored = null;
      try { stored = localStorage.getItem(KEY); } catch (e) {}
      if (stored === 'dark' || stored === 'light') {
        root.setAttribute('data-theme', stored);
      }
      var btn = document.getElementById('theme-toggle');
      if (btn) {
        function sync() {
          var dark = root.getAttribute('data-theme') === 'dark';
          btn.textContent = dark ? '☀️' : '🌙';
          btn.setAttribute('aria-pressed', String(dark));
        }
        sync();
        btn.addEventListener('click', function () {
          var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          try { localStorage.setItem(KEY, next); } catch (e) {}
          sync();
        });
      }

      // 移动端抽屉菜单
      var toggle = document.getElementById('nav-toggle');
      var drawer = document.getElementById('nav-drawer');
      if (toggle && drawer) {
        toggle.addEventListener('click', function () {
          var open = drawer.hasAttribute('hidden');
          if (open) {
            drawer.removeAttribute('hidden');
            toggle.setAttribute('aria-expanded', 'true');
            toggle.textContent = '✕';
          } else {
            drawer.setAttribute('hidden', '');
            toggle.setAttribute('aria-expanded', 'false');
            toggle.textContent = '☰';
          }
        });
        // 点击链接后自动收起
        drawer.addEventListener('click', function (e) {
          if (e.target.tagName === 'A') {
            drawer.setAttribute('hidden', '');
            toggle.setAttribute('aria-expanded', 'false');
            toggle.textContent = '☰';
          }
        });
      }
    })();
  </script>
</body>
</html>
